<!DOCTYPE html>
<html>
<head>
    <title>Rework Tracker</title>
</head>
<body>
    <h1>Mercedes-Benz Vans — Rework Tracker</h1>
    <a href="/create">+ Create New Request</a>
    <table border="1" cellpadding="8" style="margin-top: 10px;">
        <tr>
            <th>ID</th><th>Part Name</th><th>Requested By</th><th>Status</th>
            <th>Current Owner</th><th>Created At</th><th>Updated At</th><th>Action</th>
        </tr>
        {% for r in requests %}
        <tr>
            <td>{{ r.RequestID }}</td>
            <td>{{ r.PartName }}</td>
            <td>{{ r.RequestedBy }}</td>
            <td>{{ r.Status }}</td>
            <td>{{ r.CurrentOwner }}</td>
            <td>{{ r.CreatedAt }}</td>
            <td>{{ r.UpdatedAt }}</td>
            <td><a href="/update/{{ r.RequestID }}">Update</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
